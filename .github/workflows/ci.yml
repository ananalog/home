name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Components use the same protocol
        run: scripts/check-protocol.sh
      - name: Shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          sudo apt-get install -y -q shellcheck >/dev/null && shellcheck -S error scripts/*.sh
